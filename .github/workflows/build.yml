{"name":"Сборка APK","permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4"},{"name":"Распаковать проект","run":"unzip -q -o DocPad-src.zip -d src\nchmod +x src/gradlew\n"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"android-actions/setup-android@v3"},{"name":"Шрифты","working-directory":"src","run":"python3 tools/fetch_fonts.py","continue-on-error":true},{"name":"Таблицы символов pdf.js","working-directory":"src","run":"npm pack pdfjs-dist@6.2.108 --silent\ntar xzf pdfjs-dist-6.2.108.tgz\ncp -r package/cmaps app/src/main/assets/editor/lib/pdfjs/cmaps\nrm -rf package pdfjs-dist-6.2.108.tgz\n","continue-on-error":true},{"uses":"gradle/actions/setup-gradle@v4"},{"name":"Ключ подписи (если задан)","env":{"KEYSTORE_BASE64":"${{ secrets.KEYSTORE_BASE64 }}"},"run":"if [ -n \"$KEYSTORE_BASE64\" ]; then\n  echo \"$KEYSTORE_BASE64\" | base64 -d > \"$RUNNER_TEMP/release.jks\"\n  echo \"SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks\" >> \"$GITHUB_ENV\"\nfi\n"},{"name":"Собрать APK","working-directory":"src","env":{"SIGNING_STORE_PASSWORD":"${{ secrets.KEYSTORE_PASSWORD }}","SIGNING_KEY_ALIAS":"${{ secrets.KEY_ALIAS }}","SIGNING_KEY_PASSWORD":"${{ secrets.KEY_PASSWORD }}","VERSION_CODE":"${{ github.run_number }}","VERSION_NAME":"1.0.${{ github.run_number }}"},"run":"./gradlew --no-daemon assembleRelease"},{"name":"Подготовить файл","run":"mkdir -p dist\ncp src/app/build/outputs/apk/release/*.apk dist/DocPad.apk\n"},{"uses":"actions/upload-artifact@v4","with":{"name":"DocPad-apk","path":"dist/DocPad.apk"}}]}},"on":{"push":null,"workflow_dispatch":null}}
